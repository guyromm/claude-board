# PostgREST for the board API (api.<board domain>). db-uri and jwt-secret come from the ENVIRONMENT
# (PGRST_DB_URI / PGRST_JWT_SECRET in .env, exported by tmux.sh) -- never put them in this tracked file.
db-schemas = "api"
db-anon-role = "board_anon"
db-pre-request = "api.pre_request"
server-host = "127.0.0.1"
server-port = 3070
db-pool = 10
# hard cap per response; the UI pages 50 at a time with Prefer: count=exact
db-max-rows = 1000
# #275/5: tokens issued for another system (auth.webgma.co.il aud = its slug) are refused. board's own tokens carry no
# aud and still pass; auth's carry aud = "board". The JWK set comes from pgrst-jwks.sh (tmux.sh WORKERS[postgrest]).
jwt-aud = "board"
